<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact Arvis — events, media, and reader mail.">
  <title>Contact | Arvis the Author</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="brand">Arvis <span>the Author</span></a>
      <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">&#9776;</button>
      <nav class="site-nav" aria-label="Main navigation">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="books.html">Books</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="contact.html" class="active">Contact</a></li>
          <li><a href="#" class="btn btn-store store-link" target="_blank" rel="noopener">Buy Now</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="page-hero">
      <div class="container">
        <h1>Get in Touch</h1>
        <p class="lead">Reader mail, media inquiries, and event bookings.</p>
      </div>
    </section>

    <section class="section">
      <div class="container narrow">
        <!-- This form needs a backend or a form service (e.g. Formspree,
             or the Yahoo store's contact tooling) before it actually sends.
             The action attribute is a placeholder. -->
        <form class="contact-form" id="contact-form" action="#" method="post">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required>

          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>

          <label for="subject">Subject</label>
          <input type="text" id="subject" name="subject">

          <label for="message">Message</label>
          <textarea id="message" name="message" rows="6" required></textarea>

          <button type="submit" class="btn btn-primary">Send Message</button>
        </form>
        <p class="form-note" id="form-note" hidden>Thanks — your message has been noted. (Hook up a form service to actually deliver it.)</p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>&copy; <span id="year"></span> Arvis the Author. All rights reserved.</p>
      <nav aria-label="Footer navigation">
        <a href="index.html">Home</a>
        <a href="books.html">Books</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="#" class="store-link" target="_blank" rel="noopener">Store</a>
      </nav>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
